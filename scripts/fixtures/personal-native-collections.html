<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fictional Muse collections</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#edf0fc;color:#202640;font:18px Georgia,serif}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;background:#dfe5fc;border:1px solid #9ba6cc;border-radius:24px;padding:10px 14px}button:disabled{opacity:.5;cursor:not-allowed}button:focus-visible{outline:2px solid #485ea4;outline-offset:3px}[data-hatch-dock]{position:fixed;inset:0 auto 0 0;width:72px;background:#d5ddf8;padding:8px}[data-hatch-full-page-shell]{height:100%;margin-inline-start:72px;display:flex;position:relative;overflow:hidden}.scroller{overflow:auto;flex:1;min-width:0}.collection-root{min-height:100%;display:flex;flex-direction:column}header{height:60px;position:sticky;top:0;z-index:2;background:#edf0fc}header>div{height:100%;padding:0 64px}[data-testid="hatch-route-header-content"]{height:100%;max-width:768px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:30px;margin:0}.collection-padding{padding:0 64px 32px}.collection-column{display:flex;flex-direction:column;width:100%;max-width:768px;margin:auto;gap:32px;padding-top:8px}.hatch-route-header-description{font-size:22px;line-height:1.5}section>h2,section>div>h2{font-size:24px}section [role=list]{display:flex;flex-direction:column;gap:0}.idea-row{display:flex;position:relative;align-items:flex-start;gap:12px;margin:0 -12px;padding:12px;border-radius:16px}.idea-row>span{display:flex;align-items:center;justify-content:center;width:44px;height:44px;flex-shrink:0;background:#d6ddf4;border-radius:14px}.idea-row>button[data-pel-click="idea_group_row_click"]{display:flex;flex-direction:column;flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}.idea-row h3{font-size:18px;margin:0 0 4px}.idea-row p{font-size:16px;margin:0;line-height:1.5}.idea-row>.menu-wrap{position:relative;z-index:1;flex-shrink:0}.menu-wrap button{padding:4px 10px}.goal-category{display:flex;align-items:center;gap:12px;padding:12px 8px;margin:0 -8px;border:0;border-radius:12px;text-align:left;background:transparent}.goal-list{display:flex;flex-direction:column;gap:12px}.goal-card{text-align:left;padding:20px;background:#d8e0ff}.goal-card h3{margin:0 0 8px}.goal-card p{margin:0}[data-pel-impression="goals_null_state_impression"]{display:flex;flex-direction:column}[data-slot="content-area-dialog-overlay"],[data-slot="dialog-overlay"]{position:fixed;inset:0;background:#0007;z-index:4}[role=dialog]{position:fixed;inset:60px 24px auto;max-width:600px;margin:auto;max-height:calc(100% - 100px);z-index:5;outline:none}[data-slot="content-area-dialog-surface"],[data-slot="dialog-surface"]{border-radius:32px;background:#e4eafe;color:#202640;box-shadow:0 20px 100px #0005;overflow:auto;max-height:calc(100vh - 100px);padding:24px;position:relative}[role=dialog] h2{font-size:26px;padding-right:42px;margin:0 0 16px}[role=dialog] p{font-size:18px;line-height:1.6}[role=dialog] button[aria-label=Close]{position:absolute;right:14px;top:14px;padding:4px 12px}.bg-hatch-primary-action-background{background:#364fb8;color:white;width:100%;margin-top:16px}[role=menu]{position:fixed;z-index:8;right:32px;top:110px;padding:8px;background:#fff;color:#222;border:1px solid #bbb;border-radius:16px}[role=menuitem]{display:block;margin:2px;background:transparent;border:0}.fixture-label{font:11px Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#64708d}.unrelated{background:#ddcc88;color:#222;font:18px Georgia,serif}.fixture-motion{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.4}}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:700px){header>div{padding:0 16px}.collection-padding{padding:0 16px 32px}.idea-row{margin-inline:0}.goal-category{margin-inline:0}h1{font-size:24px}}
</style></head><body><nav data-hatch-dock><button>Home</button></nav><div data-hatch-full-page-shell><div class="scroller"><div class="collection-root"><header><div><div data-testid="hatch-route-header-content"><div class="hatch-route-header-title"><h1></h1></div><button data-testid="hatch-route-header-side-chat-toggle" aria-label="Open side-by-side chat">↗</button></div></div></header><div class="collection-padding"><div class="collection-column"><p class="fixture-label">Fictional offline fixture · No account or model requests</p></div></div></div></div></div><nav aria-label="Side chats"></nav><script>
(()=>{
const state=window.__collectionFixture={documentId:Math.random().toString(36).slice(2),started:0,created:0,deleted:0,approved:0};
const goals=location.pathname.includes('goals'),column=document.querySelector('.collection-column');document.querySelector('h1').textContent=goals?'Goals':'Ideas';
const ideaRows=[['Make a calm desktop workspace','Bring your everyday tools together in a focused space.'],['Plan a small weekend project','Turn a spare afternoon into something useful.']];
const ideaRow=(title,description)=>`<div role="listitem"><div class="idea-row"><span aria-hidden="true">✦</span><button data-pel-click="idea_group_row_click" data-pel-impression="idea_group_row_impression"><h3>${title}</h3><p>${description}</p></button><div class="menu-wrap"><button data-pel-click="idea_menu_click" aria-label="More options">⋯</button></div></div></div>`;
if(!goals){column.classList.add('@container/ideas');column.insertAdjacentHTML('beforeend',`<section data-pel-impression="idea_group_card_impression"><h2>For your workspace</h2><div role="list">${ideaRows.map(row=>ideaRow(...row)).join('')}</div></section><section data-pel-impression="idea_group_card_impression"><h2>Try something new</h2><div role="list">${ideaRow('A long title that should wrap naturally without hiding the adjacent options menu in a narrow desktop window','A longer description that remains readable while cards stay inside the collection column.')}</div></section>`);}
else column.insertAdjacentHTML('beforeend',`<p class="hatch-route-header-description">Pick a category and tell me what you're after.</p><section><div><h2 id="hatch-goals-create">Create a goal</h2></div><div role="group" aria-label="Goal categories" data-pel-impression="goals_null_state_impression">${['Health','Career','Something else'].map(label=>`<button class="goal-category" data-pel-click="goals_null_state_category_click"><span aria-hidden="true">◇</span><span>${label}</span></button>`).join('')}</div></section><section class="goal-list"><h2>Your goals</h2><button class="goal-card"><h3>Ship a focused first version</h3><p role="status">In progress · Updated today</p></button><button class="goal-card" disabled><h3>Review the next milestone</h3><p>Waiting for your review</p></button></section>`);
function close(){document.querySelector('[role=dialog]')?.remove();document.querySelector('[data-slot$="dialog-overlay"]')?.remove();document.querySelector('[role=menu]')?.remove();}
function dialog(title,idea){close();const overlay=document.createElement('div');overlay.dataset.slot=idea?'content-area-dialog-overlay':'dialog-overlay';document.body.append(overlay);const d=document.createElement('div');d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-label',title);d.dataset.slot=idea?'content-area-dialog-content':'dialog-content';d.innerHTML=`<div data-slot="${idea?'content-area-dialog-surface':'dialog-surface'}"><button data-slot="dialog-close" aria-label="Close">×</button><div ${idea?'data-pel-impression="idea_preview_dialog_impression" role="group"':''}><h2 data-slot="dialog-title">${title}</h2><p data-slot="dialog-description">${idea?'Keep your useful tools close, with a comfortable space to think.':'First, we will refine the goal together in chat. Nothing has been started yet.'}</p><p>A fictional preview with the original service controls intact.</p><span class="fixture-motion" role="status">Ready for your review</span></div><button class="bg-hatch-primary-action-background" data-slot="button">Let's do it</button></div>`;document.body.append(d);d.querySelector('[aria-label=Close]').onclick=close;d.querySelector('.bg-hatch-primary-action-background').onclick=()=>{if(idea)state.started++;else state.created++;};}
document.addEventListener('click',event=>{const idea=event.target.closest('[data-pel-click="idea_group_row_click"]');if(idea)dialog(idea.querySelector('h3').textContent,true);const category=event.target.closest('[data-pel-click="goals_null_state_category_click"]');if(category)dialog('Create a new goal',false);const goal=event.target.closest('.goal-card:not(:disabled)');if(goal)dialog(goal.querySelector('h3').textContent,false);if(event.target.closest('[data-pel-click="idea_menu_click"]')){document.querySelector('[role=menu]')?.remove();const m=document.createElement('div');m.setAttribute('role','menu');m.dataset.slot='dropdown-menu-content';m.innerHTML='<button role="menuitem">Dismiss idea</button><button role="menuitem">Cancel</button>';document.body.append(m);m.firstChild.onclick=()=>state.deleted++;m.lastChild.onclick=()=>m.remove();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape')close();});
state.updateCollection=()=>{if(goals){document.querySelector('.goal-card h3').textContent='First version ready for review';document.querySelector('.goal-card [role=status]').textContent='Completed';}else{document.querySelector('[data-pel-click="idea_group_row_click"] h3').textContent='Workspace idea updated';document.querySelector('[role=list]').insertAdjacentHTML('beforeend',ideaRow('A newly synced idea','This row arrived after the first render.'));}};
state.unrecognize=()=>{document.querySelector('[data-hatch-full-page-shell]').removeAttribute('data-hatch-full-page-shell');};
})();
</script></body></html>
