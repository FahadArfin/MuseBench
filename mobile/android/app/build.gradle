plugins { id 'com.android.application' }

def releaseVersion = providers.gradleProperty('museVersion').getOrElse('0.2.0')
def releaseCode = providers.gradleProperty('museVersionCode').getOrElse('1').toInteger()
def keyFile = System.getenv('ANDROID_KEYSTORE_PATH')
android {
    namespace 'io.github.fahadarfin.musebench'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.fahadarfin.musebench'
        minSdk 26
        targetSdk 35
        versionCode releaseCode
        versionName releaseVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (keyFile) {
                storeFile file(keyFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDirs = ['../../../mobile-dist'] }
}
tasks.register('requireReleaseKey') {
    doLast { if (!keyFile) throw new GradleException('Set the Android release signing environment before building a release.') }
}
tasks.configureEach { if (name == 'preReleaseBuild') dependsOn 'requireReleaseKey' }
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
