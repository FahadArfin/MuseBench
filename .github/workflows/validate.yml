name: Validate desktop and preview
on:
  push:
    # Main calls the same checks from release.yml, once per source revision.
    branches-ignore: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: musebench-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    uses: ./.github/workflows/windows-checks.yml
