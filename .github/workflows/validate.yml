name: Validate desktop and preview
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - name: Use canonical Windows temporary paths
        shell: pwsh
        run: |
          node -e "const fs=require('node:fs'); const p=fs.realpathSync(process.env.RUNNER_TEMP); console.log(JSON.stringify({original:process.env.TEMP,canonical:p})); fs.appendFileSync(process.env.GITHUB_ENV, 'TEMP='+p+'\nTMP='+p+'\n');"
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:startup-animation
      - run: npm run test:session-recovery
      - run: npm run test:profile-identity
      - run: npm run test:typography
      - run: npm run test:motion
      - run: npm run test:activity
      - run: npm run test:child-inspection
      - run: npm run test:native-failure
      - run: npm run test:native-question
      - run: npm run test:plugin-tools
      - run: npm run test:chat-organization
      - run: npm run test:code-responsiveness
      - run: npm run test:browser-preview
      - run: npm run test:onboarding-preview
      - run: npm run test:catalog-preview
      - run: npm run test:catalog-desktop
      - run: npm run test:billing-preview
      - run: npm run test:billing-desktop
      - run: npm run test:preview-parity
      # These runs use only clean fixtures. Never upload local account captures.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-check-reports
          path: |
            artifacts/browser-preview/report.json
            artifacts/preview-parity/report.json
            artifacts/startup-animation/**/report.json
            artifacts/catalog-preview/**/report.json
            artifacts/catalog-desktop/**/report.json
            artifacts/billing-ui/**/report.json
            artifacts/motion/**/report.json
            artifacts/activity-ui/**/report.json
            artifacts/child-inspection-ui/**/report.json
            artifacts/native-failure-ui/**/report.json
            artifacts/native-question-ui/**/report.json
            artifacts/plugin-tools-ui/**/report.json
