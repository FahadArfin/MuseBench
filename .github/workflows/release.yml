name: Release MuseBench
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_other_platforms:
        description: Test all platforms (artifacts only; do not publish a release)
        type: boolean
        default: false
        required: false
permissions:
  contents: read
env:
  # The cache is optional; a stalled download must not hold every release worker.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: '1'
concurrency:
  group: musebench-release
  cancel-in-progress: false
jobs:
  validation:
    name: Validate desktop and preview
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-checks.yml
    with:
      release: true
  build:
    name: Package Windows 64-bit (x64)
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: node scripts/canonical-ci-temp.mjs
      - run: npm ci
      - id: version
        run: node scripts/stamp-release.mjs
      - run: npm run build
      - run: node scripts/package-desktop.mjs
      - run: node scripts/verify-personal-package.mjs
      - run: node scripts/portable-desktop-smoke.mjs
      - run: node scripts/release-assets.mjs stage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-package-reports
          path: |
            artifacts/portable-desktop/report.json
            artifacts/personal-package-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          path: release-assets/*
  native:
    name: ${{ matrix.label }}
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.include_other_platforms == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            platform: win32
            arch: arm64
            label: Windows ARM64
            artifact: windows-arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            label: Linux 64-bit (x64)
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            label: Linux ARM64
            artifact: linux-arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
            label: macOS Intel
            artifact: macos-intel
          - runner: macos-15
            platform: darwin
            arch: arm64
            label: macOS Apple silicon
            artifact: macos-apple-silicon
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: node scripts/canonical-ci-temp.mjs
      - run: npm ci
      - run: node scripts/stamp-release.mjs
      - name: Portable runtime and release contracts
        run: node --test test/platform-services.test.mjs test/release-assets.test.mjs test/file-editor.test.mjs test/runtime.test.mjs test/onboarding.test.mjs test/native-hooks.test.mjs test/hook-presets.test.mjs
      - name: Windows ARM native process coverage
        if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          npm test
      - run: npm run build
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: node scripts/package-desktop.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-personal-package.mjs
      - name: Boot native Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/portable-desktop-smoke.mjs
      - name: Boot native Windows or macOS package
        if: runner.os != 'Linux'
        run: node scripts/portable-desktop-smoke.mjs
      - run: node scripts/release-assets.mjs stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.artifact }}
          path: |
            artifacts/portable-desktop/*
            artifacts/personal-package-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: release-assets/*
  android:
    name: Android phones and tablets
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.include_other_platforms == true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: npm ci --ignore-scripts
      - run: node scripts/stamp-release.mjs
      - run: npm run build:mobile
      - run: npx playwright install --with-deps chromium
      - run: node scripts/mobile-ui-smoke.mjs
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and verify the signed Android package
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/musebench-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          version=$(node -p 'require("./package.json").version')
          code=$(git rev-list --count HEAD)
          gradle -p mobile/android testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease -PmuseVersion="$version" -PmuseVersionCode="$code" --console plain
          node scripts/stage-android.mjs
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Android TLS, pairing, storage and isolated WebViews
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/test-android-emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-android
          path: |
            mobile/android/app/build/reports/tests/
            mobile/android/app/build/reports/androidTests/
            artifacts/mobile-ui/
            artifacts/mobile-emulator/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: android-universal
          if-no-files-found: error
          path: release-assets/*
  publish:
    name: Publish verified downloads
    needs: [validation, build, native, android]
    if: ${{ !cancelled() && inputs.include_other_platforms != true && needs.validation.result == 'success' && needs.build.result == 'success' && (needs.native.result == 'success' || needs.native.result == 'skipped') && (needs.android.result == 'success' || needs.android.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: incoming
      - uses: actions/download-artifact@v4
        if: inputs.include_other_platforms == true
        with:
          name: android-universal
          path: incoming/android-universal
      - name: Verify and combine platform assets
        run: node scripts/release-assets.mjs collect
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_PROFILE: ${{ inputs.include_other_platforms && 'all' || 'windows-x64' }}
      - name: Publish validated platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_PROFILE: ${{ inputs.include_other_platforms && 'all' || 'windows-x64' }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "A newer main commit superseded this build; skipping publication."
            exit 0
          fi
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "This immutable version already has a published release."
              exit 0
            fi
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            test "$target" = "$SOURCE_SHA"
            echo "An existing draft requires review. Its assets and notes were left unchanged."
            exit 1
          fi
          if [ "$RELEASE_PROFILE" = "all" ]; then
            downloads='Windows x64/ARM64 installers, Linux x64/ARM64 AppImage/deb, macOS Intel/Apple silicon dmg/zip, and a signed Android phone/tablet APK. macOS downloads are ad-hoc signed, not notarized; update manually.'
          else
            downloads='Windows 11 x64 installer (Intel/AMD 64-bit). Other platforms are deferred while we focus on faster Windows updates.'
          fi
          printf 'Built from commit %s after validation and native package launch checks.\n\n%s\n\nExisting app data is retained. SHA256SUMS and release-manifest.json record integrity and source provenance.\n' "$SOURCE_SHA" "$downloads" > release-notes.txt
          gh release create "$tag" release/* --target "$SOURCE_SHA" --title "MuseBench $VERSION" --notes-file release-notes.txt --latest
