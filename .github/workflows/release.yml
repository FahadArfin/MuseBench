name: Release MuseBench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: musebench-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: node scripts/canonical-ci-temp.mjs
      - run: npm ci
      - run: npx playwright install chromium
      - id: version
        run: node scripts/stamp-release.mjs
      - run: npm test
      - run: npm run build
      - run: npm run test:startup-animation
      - run: npm run test:session-recovery
      - run: npm run test:profile-identity
      - run: npm run test:typography
      - run: npm run test:motion
      - run: npm run test:activity
      - run: npm run test:child-inspection
      - run: npm run test:chat-organization
      - run: npm run test:code-responsiveness
      - run: npm run test:navigation-cache
      - run: npm run test:browser-preview
      - run: npm run test:onboarding-preview
      - run: npm run test:catalog-preview
      - run: npm run test:catalog-desktop
      - run: npm run test:billing-preview
      - run: npm run test:billing-desktop
      - run: npm run test:preview-parity
      - run: node scripts/package-desktop.mjs
      - run: node scripts/verify-personal-package.mjs
      - run: node scripts/portable-desktop-smoke.mjs
      - run: node scripts/release-assets.mjs stage
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-check-reports
          path: |
            artifacts/startup-animation/**/report.json
            artifacts/catalog-preview/**/report.json
            artifacts/catalog-desktop/**/report.json
            artifacts/billing-ui/**/report.json
            artifacts/motion/**/report.json
            artifacts/activity-ui/**/report.json
            artifacts/child-inspection-ui/**/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-win32-x64
          if-no-files-found: error
          path: release-assets/*
  native:
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            platform: win32
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - runner: macos-15-intel
            platform: darwin
            arch: x64
          - runner: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: node scripts/canonical-ci-temp.mjs
      - run: npm ci
      - run: node scripts/stamp-release.mjs
      - name: Portable runtime and release contracts
        run: node --test test/platform-services.test.mjs test/release-assets.test.mjs test/file-editor.test.mjs test/runtime.test.mjs test/onboarding.test.mjs
      - name: Windows ARM native process coverage
        if: runner.os == 'Windows'
        run: |
          npx playwright install chromium
          npm test
      - run: npm run build
      - name: Install Linux browser dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium
      - run: node scripts/package-desktop.mjs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-personal-package.mjs
      - name: Boot native Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/portable-desktop-smoke.mjs
      - name: Boot native Windows or macOS package
        if: runner.os != 'Linux'
        run: node scripts/portable-desktop-smoke.mjs
      - run: node scripts/release-assets.mjs stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            artifacts/portable-desktop/*
            artifacts/personal-package-verification.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: release-assets/*
  publish:
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: incoming
      - name: Verify and combine platform assets
        run: node scripts/release-assets.mjs collect
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
      - name: Publish validated platform downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "A newer main commit superseded this build; skipping publication."
            exit 0
          fi
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft --jq .isDraft)
            if [ "$draft" != "true" ]; then
              echo "This immutable version already has a published release."
              exit 0
            fi
            target=$(gh release view "$tag" --json targetCommitish --jq .targetCommitish)
            test "$target" = "$SOURCE_SHA"
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --draft=false --latest
            exit 0
          fi
          printf 'Built from commit %s after validation and native package launch checks.\n\nWindows x64/ARM64 installers, Linux x64/ARM64 AppImage/deb, and macOS Intel/Apple silicon dmg/zip. macOS downloads are ad-hoc signed, not notarized; update manually. Existing desktop chats and settings are retained. SHA256SUMS and release-manifest.json record integrity and source provenance.\n' "$SOURCE_SHA" > release-notes.txt
          gh release create "$tag" release/* --target "$SOURCE_SHA" --title "MuseBench $VERSION" --notes-file release-notes.txt --latest
